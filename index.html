<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CineMemo Lite</title>

        <link rel="stylesheet" href="main.css">
    </head>

    <body>

        <header class="header">
            <div class="brand">
                <div class="brand-icon">🎬</div>

                <div>
                    <h1>
                        CineMemo <span>Lite</span>
                    </h1>

                    <p>Your personal movie &amp; series library</p>
                </div>
            </div>

            <div class="header-stats">
                <div class="title-count">
                    <span id="total-count">0</span>
                    <small>titles</small>
                </div>

                <a href="/admin/" class="admin-link">
                    Admin Panel
                </a>
            </div>
        </header>


        <main class="container">

            <section class="controls">

                <div class="search-wrapper">
                    <label for="search" class="sr-only">
                        Search library
                    </label>

                    <input type="search" id="search" class="search-input" placeholder="Search movies and series..."
                        autocomplete="off">
                </div>


                <div class="filter-group">

                    <label for="type-filter" class="sr-only">
                        Filter by type
                    </label>

                    <select id="type-filter" class="filter-select">
                        <option value="">All types</option>
                    </select>


                    <label for="status-filter" class="sr-only">
                        Filter by status
                    </label>

                    <select id="status-filter" class="filter-select">
                        <option value="">All statuses</option>
                    </select>


                    <label for="sort-filter" class="sr-only">
                        Sort library
                    </label>

                    <select id="sort-filter" class="filter-select">
                        <option value="title-asc">Title A–Z</option>
                        <option value="title-desc">Title Z–A</option>
                        <option value="year-desc">Newest first</option>
                        <option value="year-asc">Oldest first</option>
                        <option value="rating-desc">Highest rating</option>
                        <option value="rating-asc">Lowest rating</option>
                    </select>


                    <button type="button" id="clear-filters" class="clear-button">
                        Clear
                    </button>

                </div>

            </section>


            <section class="result-bar">

                <div>
                    Showing
                    <strong id="result-count">0</strong>
                    of
                    <strong id="result-total">0</strong>
                    titles
                </div>

            </section>


            <section id="media-list" class="media-list" aria-live="polite"></section>


            <section id="empty-state" class="empty-state hidden">
                <div class="empty-icon">🎬</div>

                <h2>No titles found</h2>

                <p>
                    Try changing your search or filters.
                </p>
            </section>

        </main>


        <script src="script.js"></script>

    </body>

</html>
